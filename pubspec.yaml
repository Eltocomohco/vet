name: vetmanager
description: Software de gestion para clinicas veterinarias
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0
  provider: ^6.1.0
  syncfusion_flutter_calendar: ^33.2.5
  syncfusion_flutter_core: ^33.2.6
  qr_flutter: ^4.1.0
  http: ^1.2.0
  image_picker: ^1.0.7
  image_picker_for_web: ^3.0.2
  intl: ^0.19.0
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  path: ^1.8.0
  universal_html: ^2.2.4
  csv: ^5.1.1
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.0

dependency_overrides:
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
